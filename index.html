
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مَشهد | مكتبة الصور</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202824;
      --muted: #69736c;
      --line: #e4e9e5;
      --green: #20865b;
      --green-dark: #176944;
      --surface: #f5f8f5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: Arial, "Noto Sans Arabic", sans-serif;
      background: #fff;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .topbar {
      height: 68px;
      padding: 0 5.5%;
      display: flex;
      align-items: center;
      gap: 34px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      color: var(--green-dark);
      font-size: 25px;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 24px;
      flex: 1;
    }

    .nav a {
      color: #4d5751;
      font-size: 14px;
      text-decoration: none;
    }

    .nav a:hover { color: var(--green); }

    .upload {
      padding: 10px 16px;
      color: #fff;
      background: var(--green);
      border: 0;
      border-radius: 5px;
      font-weight: 700;
    }

    .upload:hover { background: var(--green-dark); }

    .hero {
      min-height: 346px;
      display: grid;
      place-items: center;
      padding: 54px 20px 48px;
      color: #fff;
      text-align: center;
      background:
        linear-gradient(90deg, rgb(12 35 25 / 69%), rgb(12 35 25 / 51%)),
        url("https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=2000&q=85") center 48% / cover;
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.2;
    }

    .hero p {
      margin: 0 0 26px;
      color: #edf5ef;
      font-size: 16px;
    }

    .search {
      width: min(720px, 92vw);
      height: 58px;
      display: flex;
      overflow: hidden;
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 5px 22px rgb(0 0 0 / 15%);
    }

    .search select {
      width: 120px;
      padding: 0 14px;
      color: #4d5751;
      background: #fff;
      border: 0;
      border-left: 1px solid var(--line);
      outline: 0;
    }

    .search input {
      min-width: 0;
      flex: 1;
      padding: 0 18px;
      color: var(--ink);
      border: 0;
      outline: 0;
    }

    .search button {
      width: 60px;
      color: white;
      background: var(--green);
      border: 0;
      font-size: 21px;
    }

    .trending {
      margin-top: 16px;
      color: #e5eee7;
      font-size: 13px;
    }

    .trending button {
      padding: 0;
      color: #fff;
      background: none;
      border: 0;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 28px 5.5% 56px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0 8px;
      scrollbar-width: thin;
    }

    .filter {
      padding: 9px 15px;
      color: #59635d;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      white-space: nowrap;
    }

    .filter.active, .filter:hover {
      color: var(--green-dark);
      background: #edf7f0;
      border-color: #a9d4b9;
    }

    .sort {
      padding: 9px 11px;
      color: #4d5751;
      background: white;
      border: 1px solid var(--line);
      border-radius: 5px;
    }

    .results {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .gallery {
      columns: 4 230px;
      column-gap: 16px;
    }

    .photo {
      position: relative;
      display: block;
      break-inside: avoid;
      margin: 0 0 16px;
      overflow: hidden;
      background: var(--surface);
      border-radius: 5px;
    }

    .photo img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform .25s ease;
    }

    .photo:hover img { transform: scale(1.035); }

    .photo-info {
      position: absolute;
      inset: auto 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 30px 13px 12px;
      color: white;
      opacity: 0;
      background: linear-gradient(transparent, rgb(0 0 0 / 65%));
      transition: opacity .2s;
    }

    .photo:hover .photo-info,
    .photo:focus-within .photo-info { opacity: 1; }

    .photo-info span { font-size: 13px; }

    .photo-info button {
      width: 34px;
      height: 34px;
      color: white;
      background: rgb(255 255 255 / 20%);
      border: 1px solid rgb(255 255 255 / 65%);
      border-radius: 4px;
    }

    .empty {
      display: none;
      padding: 48px 10px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 700px) {
      .topbar { height: 60px; padding: 0 16px; gap: 18px; }
      .nav { gap: 14px; }
      .nav a:nth-child(n+2) { display: none; }
      .upload { padding: 9px 11px; font-size: 13px; }
      .hero { min-height: 330px; }
      main { padding: 22px 16px 40px; }
      .toolbar { align-items: flex-start; flex-direction: column; gap: 8px; }
      .filters { max-width: 100%; }
      .sort { align-self: flex-end; }
      .gallery { columns: 2 145px; column-gap: 10px; }
      .photo { margin-bottom: 10px; }
      .photo-info { opacity: 1; padding: 24px 9px 9px; }
      .photo-info span { font-size: 11px; }
    }

    @media (max-width: 360px) {
      .search select { width: 92px; padding: 0 8px; }
      .gallery { columns: 1; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">مَشهد</a>
    <nav class="nav" aria-label="التنقل الرئيسي">
      <a href="#">استكشف</a>
      <a href="#">الصور</a>
      <a href="#">المصورون</a>
    </nav>
    <button class="upload" type="button" onclick="alert('أضف هنا صفحة رفع الصور')">＋ رفع صورة</button>
  </header>

  <section class="hero">
    <div>
      <h1>اكتشف الصورة التي تبحث عنها</h1>
      <p>مجموعة من الصور الملهمة لمشاريعك وأفكارك.</p>
      <form class="search" id="searchForm">
        <select aria-label="نوع المحتوى">
          <option>الصور</option>
          <option>الرسوم</option>
          <option>المتجهات</option>
        </select>
        <input id="searchInput" type="search" placeholder="ابحث عن صور الطبيعة، المدن، السفر..." aria-label="ابحث في الصور">
        <button type="submit" aria-label="بحث">⌕</button>
      </form>
      <div class="trending">الأكثر بحثاً:
        <button type="button" data-search="طبيعة">طبيعة</button>،
        <button type="button" data-search="مدينة">مدينة</button>،
        <button type="button" data-search="بحر">بحر</button>
      </div>
    </div>
  </section>

  <main>
    <div class="toolbar">
      <div class="filters" aria-label="تصنيف الصور">
        <button class="filter active" data-category="all">الكل</button>
        <button class="filter" data-category="طبيعة">طبيعة</button>
        <button class="filter" data-category="مدينة">مدن</button>
        <button class="filter" data-category="بحر">بحر</button>
        <button class="filter" data-category="حيوانات">حيوانات</button>
        <button class="filter" data-category="طعام">طعام</button>
      </div>
      <select class="sort" aria-label="ترتيب النتائج">
        <option>الأكثر رواجاً</option>
        <option>الأحدث</option>
      </select>
    </div>

    <p class="results" id="resultCount">صور مختارة لإلهامك</p>
    <section class="gallery" id="gallery" aria-label="معرض الصور">
      <figure class="photo" data-tags="طبيعة جبل غابة">
        <img loading="lazy" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=700&q=80" alt="بحيرة هادئة بين الجبال">
        <figcaption class="photo-info"><span>طبيعة وجبال</span><button aria-label="حفظ الصورة">♡</button></figcaption>
      </figure>
      <figure class="photo" data-tags="مدينة مباني معمار">
        <img loading="lazy" src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=700&q=80" alt="مدينة مضاءة عند المساء">
        <figcaption class="photo-info"><span>أضواء المدينة</span><button aria-label="حفظ الصورة">♡</button></figcaption>
      </figure>
      <figure class="photo" data-tags="بحر شاطئ طبيعة">
        <img loading="lazy" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=700&q=80" alt="شاطئ استوائي ومياه زرقاء">
        <figcaption class="photo-info"><span>شاطئ استوائي</span><button aria-label="حفظ الصورة">♡</button></figcaption>
      </figure>
      <figure class="photo" data-tags="حيوانات طيور طبيعة">
        <img loading="lazy" src="https://images.unsplash.com/photo-1444464666168-49d633b86797?auto=format&fit=crop&w=700&q=80" alt="طائر يقف بين الأغصان">
        <figcaption class="photo-info"><span>حياة الطيور</span><button aria-label="حفظ الصورة">♡</button></figcaption>
      </figure>
      <figure class="photo" data-tags="طعام قهوة">
        <img loading="lazy" src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=700&q=80" alt="فنجان قهوة على طاولة">
        <figcaption class="photo-info"><span>استراحة قهوة</span><button aria-label="حفظ الصورة">♡</button></figcaption>
      </figure>
      <figure class="photo" data-tags="طبيعة زهور">
        <img loading="lazy" src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=700&q=80" alt="زهور ملونة في ضوء الشمس">
        <figcaption class="photo-info"><span>ألوان الربيع</span><button aria-label="حفظ الصورة">♡</button></figcaption>
      </figure>
      <figure class="photo" data-tags="مدينة معمار">
        <img loading="lazy" src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=700&q=80" alt="تفاصيل معمارية في المدينة">
        <figcaption class="photo-info"><span>عمارة حديثة</span><button aria-label="حفظ الصورة">♡</button></figcaption>
      </figure>
      <figure class="photo" data-tags="طبيعة جبل">
        <img loading="lazy" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=700&q=80" alt="قمم جبلية تحت السماء">
        <figcaption class="photo-info"><span>قمم شاهقة</span><button aria-label="حفظ الصورة">♡</button></figcaption>
      </figure>
    </section>
    <p class="empty" id="emptyState">لا توجد صور مطابقة. جرّب كلمة بحث أخرى.</p>
  </main>

  <script>
    const input = document.querySelector("#searchInput");
    const photos = [...document.querySelectorAll(".photo")];
    const filters = [...document.querySelectorAll(".filter")];
    const count = document.querySelector("#resultCount");
    const empty = document.querySelector("#emptyState");
    let category = "all";

    function updateGallery() {
      const query = input.value.trim().toLowerCase();
      let visible = 0;

      photos.forEach(photo => {
        const tags = photo.dataset.tags.toLowerCase();
        const matchesQuery = !query || tags.includes(query);
        const matchesCategory = category === "all" || tags.includes(category);
        const show = matchesQuery && matchesCategory;
        photo.hidden = !show;
        if (show) visible++;
      });

      count.textContent = `عدد الصور: ${visible}`;
      empty.style.display = visible ? "none" : "block";
    }

    document.querySelector("#searchForm").addEventListener("submit", event => {
      event.preventDefault();
      updateGallery();
    });

    input.addEventListener("input", updateGallery);

    filters.forEach(button => {
      button.addEventListener("click", () => {
        filters.forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        category = button.dataset.category;
        updateGallery();
      });
    });

    document.querySelectorAll("[data-search]").forEach(button => {
      button.addEventListener("click", () => {
        input.value = button.dataset.search;
        updateGallery();
      });
    });

    document.querySelectorAll(".photo-info button").forEach(button => {
      button.addEventListener("click", () => {
        button.textContent = button.textContent === "♡" ? "♥" : "♡";
      });
    });

    updateGallery();
  </script>
</body>
</html>
```
