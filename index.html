<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AZ-8K | Free 8K Ultra HD Stock Photos & Videos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .masonry-grid { column-count: 1; column-gap: 1.25rem; }
    @media (min-width: 640px) { .masonry-grid { column-count: 2; } }
    @media (min-width: 1024px) { .masonry-grid { column-count: 3; } }
    .masonry-item { break-inside: avoid; margin-bottom: 1.25rem; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-black">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-slate-950/90 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-gradient-to-r from-emerald-500 to-teal-400 p-2 rounded-xl text-slate-950 font-black shadow-lg">AZ</div>
        <span class="text-xl font-black tracking-wider text-white">AZ-8K</span>
      </div>
      <button onclick="openAuthModal()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs sm:text-sm transition shadow-lg">
        Upload
      </button>
    </div>
  </header>

  <!-- Hero & Live Search -->
  <section class="relative h-[50vh] min-h-[360px] flex flex-col items-center justify-center text-center px-4 overflow-hidden bg-slate-900">
    <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=1920&q=80')] bg-cover bg-center opacity-20"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/60 to-transparent"></div>

    <div class="relative z-10 max-w-3xl w-full">
      <h1 class="text-3xl sm:text-5xl font-black tracking-tight text-white mb-3">
        Stunning Free <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-300">8K & 4K</span> Stock Media
      </h1>
      <p class="text-slate-400 text-xs sm:text-sm mb-6">Explore millions of free high-resolution photos and videos.</p>

      <!-- Search Input -->
      <form onsubmit="handleSearch(event)" class="relative max-w-2xl mx-auto shadow-2xl flex items-center">
        <input 
          type="text" 
          id="searchInput"
          placeholder="Search for desert, 8K nature, wallpaper, ocean..." 
          class="w-full h-12 sm:h-14 pl-11 pr-28 rounded-2xl bg-slate-900/90 border border-slate-700 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-xs sm:text-base backdrop-blur-md"
        >
        <i data-lucide="search" class="absolute left-4 text-emerald-400 w-5 h-5"></i>
        <button type="submit" class="absolute right-1.5 top-1.5 bottom-1.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold px-5 rounded-xl text-xs sm:text-sm transition">
          Search
        </button>
      </form>
    </div>
  </section>

  <!-- Main Media Container -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <!-- Status Indicator -->
    <div id="statusText" class="text-xs font-bold text-slate-400 mb-6 uppercase tracking-wider">Trending 8K Media</div>

    <!-- Live Dynamic Grid -->
    <div id="mediaGrid" class="masonry-grid">
      <!-- Media Items Inserted Dynamically via JS -->
    </div>
  </main>

  <!-- Download Modal -->
  <div id="downloadModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
    <div class="relative w-full max-w-lg bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl p-6 text-white">
      <button onclick="closeDownloadModal()" class="absolute top-4 right-4 p-2 rounded-full bg-slate-950 text-slate-400 hover:text-white">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <h3 id="dlTitle" class="text-sm font-bold mb-4 text-emerald-400">Download High-Res Media</h3>
      
      <div id="modalPreview" class="mb-4 rounded-xl overflow-hidden h-52 bg-slate-950 flex items-center justify-center">
        <img id="modalImg" src="" class="h-full w-full object-cover">
      </div>

      <div class="space-y-2.5 mb-6 text-xs">
        <a id="downloadBtn8K" href="#" target="_blank" download class="w-full p-3 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 flex justify-between items-center font-bold text-white transition">
          <span>8K Ultra HD Original</span>
          <i data-lucide="download" class="w-4 h-4 text-emerald-400"></i>
        </a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-slate-950 border-t border-slate-800/80 py-8 text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <div class="bg-emerald-500 text-slate-950 font-black px-2 py-1 rounded text-xs">AZ</div>
        <span class="font-bold text-slate-300">AZ-8K Global Media Platform</span>
      </div>
      <div>© 2026 AZ-8K. All rights reserved.</div>
    </div>
  </footer>

  <script>
    lucide.createIcons();

    // Free API Key for Live Pexels Media Fetching
    const API_KEY = '563492ad6f91700001000001c0b3d6f1a8c0490f84cb7e3e7f539744';

    // Initial Load - Fetch Trending Desert & 8K Nature Media
    window.addEventListener('DOMContentLoaded', () => {
      fetchLiveMedia('desert nature 8k');
    });

    function handleSearch(e) {
      e.preventDefault();
      const query = document.getElementById('searchInput').value.trim();
      if(query) {
        document.getElementById('statusText').innerText = 'Results for: ' + query;
        fetchLiveMedia(query);
      }
    }

    async function fetchLiveMedia(query) {
      const grid = document.getElementById('mediaGrid');
      grid.innerHTML = '<div class="col-span-full text-center py-20 text-emerald-400 font-bold">Loading 8K Media...</div>';

      try {
        const response = await fetch(`https://api.pexels.com/v1/search?query=${encodeURIComponent(query)}&per_page=15`, {
          headers: { Authorization: API_KEY }
        });
        const data = await response.json();

        if (!data.photos || data.photos.length === 0) {
          grid.innerHTML = '<div class="col-span-full text-center py-20 text-slate-400">No media found. Try another search.</div>';
          return;
        }

        grid.innerHTML = '';
        data.photos.forEach(photo => {
          const item = document.createElement('div');
          item.className = 'masonry-item group relative rounded-2xl overflow-hidden bg-slate-900 border border-slate-800 shadow-xl cursor-pointer';
          item.onclick = () => openDownloadModal(photo.photographer, photo.src.original, photo.src.large2x);

          item.innerHTML = `
            <img src="${photo.src.large}" alt="${photo.alt}" class="w-full h-auto object-cover group-hover:scale-105 transition duration-500">
            <div class="absolute top-3 right-3 bg-slate-950/80 backdrop-blur-md px-2.5 py-1 rounded-lg border border-slate-700/50 text-[10px] font-black text-emerald-400">
              8K ULTRA HD
            </div>
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 p-4 flex flex-col justify-end">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-slate-200">${photo.photographer}</span>
                <span class="bg-emerald-500 text-slate-950 font-black px-3 py-1.5 rounded-xl text-xs flex items-center gap-1">
                  <i data-lucide="download" class="w-3.5 h-3.5"></i> Download
                </span>
              </div>
            </div>
          `;
          grid.appendChild(item);
        });
        lucide.createIcons();

      } catch (error) {
        grid.innerHTML = '<div class="col-span-full text-center py-20 text-red-400">Failed to load media. Please check your connection.</div>';
      }
    }

    function openDownloadModal(author, origUrl, previewUrl) {
      document.getElementById('dlTitle').innerText = 'Photo by: ' + author;
      document.getElementById('modalImg').src = previewUrl;
      document.getElementById('downloadBtn8K').href = origUrl;
      document.getElementById('downloadModal').classList.remove('hidden');
    }

    function closeDownloadModal() {
      document.getElementById('downloadModal').classList.add('hidden');
    }
  </script>
</body>
</html>
